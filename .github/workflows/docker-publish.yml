name: Publish Docker (tags only)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    environment: ds-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Necessario para builds multi-arch (amd64/arm64)
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          echo "value=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      # Gera tags Docker a partir da tag Git (SemVer)
      - name: Docker meta (agent)
        id: meta_agent
        uses: docker/metadata-action@v5
        with:
          images: leufrasiojunior/docksentinelagent
          tags: |
            # v0.1.0        -> 0.1.0, 0.1, 0
            # v0.1.0-beta.1 -> 0.1.0-beta.1 (apenas full)
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

            type=sha,format=short,prefix=sha-

      - name: Add channel tags (latest/alpha/beta)
        id: channel
        shell: bash
        run: |
          REF="${GITHUB_REF_NAME}"
          AGENT_EXTRA=""
          if [[ "$REF" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            AGENT_EXTRA="leufrasiojunior/docksentinelagent:latest"
          fi
          if [[ "$REF" == *"-alpha."* ]]; then
            AGENT_EXTRA="leufrasiojunior/docksentinelagent:alpha"
          fi
          if [[ "$REF" == *"-beta."* ]]; then
            AGENT_EXTRA="leufrasiojunior/docksentinelagent:beta"
          fi

          echo "agent_extra_tags<<EOF" >> $GITHUB_OUTPUT
          echo "$AGENT_EXTRA" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build and push agent (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            APP_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ${{ steps.meta_agent.outputs.tags }}
            ${{ steps.channel.outputs.agent_extra_tags }}
          labels: ${{ steps.meta_agent.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
